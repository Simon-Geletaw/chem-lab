<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chem-lab</title>
  </head>
  <body>
    <div id="start-overlay">
      <div id="start-card">
        <h1>Chemistry Lab</h1>
        <p id="overlay-enter">Click anywhere to enter</p>
        <p id="overlay-keys" class="keys"><b>W A S D</b> walk &nbsp;•&nbsp; <b>Mouse</b> look &nbsp;•&nbsp; <b>ESC</b> release cursor</p>
        <button id="tour-btn">&#9654; Start Guided Tour</button>
      </div>
    </div>
    <div id="crosshair"></div>
    <button id="tour-skip">Skip Tour &#10005;</button>
    <div id="mobile-controls">
      <button id="btn-up" class="dpad">&#9650;</button>
      <button id="btn-left" class="dpad">&#9664;</button>
      <button id="btn-down" class="dpad">&#9660;</button>
      <button id="btn-right" class="dpad">&#9654;</button>
    </div>
    <div id="info-panel">
      <button id="info-close">✕</button>
      <h2 id="info-title"></h2>
      <p id="info-description"></p>
    </div>
    <script type="module" src="/src/main.js"></script>

    <style>
      #start-overlay {
        position: fixed;
        inset: 0;                       /* shorthand: top/right/bottom/left = 0 */
        display: flex;                  /* center the card both ways */
        align-items: center;
        justify-content: center;
        background: rgba(10, 18, 26, 0.75);
        z-index: 20;                    /* above the canvas AND the info panel */
        cursor: pointer;
        font-family: system-ui, sans-serif;
        color: #fff;
        text-align: center;
      }
      #start-card h1 { margin: 0 0 8px; font-size: 42px; letter-spacing: 2px; }
      #start-card p  { margin: 4px 0; font-size: 18px; opacity: 0.9; }
      #start-card .keys { font-size: 14px; opacity: 0.65; margin-top: 14px; }

      #crosshair {
        display: none;                  /* only shown while pointer is locked */
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;          /* center the dot exactly */
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
        z-index: 15;
        pointer-events: none;           /* clicks pass straight through it */
      }

      #mobile-controls {
        display: none;                  /* player.js switches this to 'grid' on touch devices */
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 15;
        /* a 3x2 grid: up sits in the top-middle cell, left/down/right below */
        grid-template-columns: repeat(3, 64px);
        grid-template-rows: repeat(2, 64px);
        gap: 8px;
      }
      #btn-up    { grid-column: 2; grid-row: 1; }
      #btn-left  { grid-column: 1; grid-row: 2; }
      #btn-down  { grid-column: 2; grid-row: 2; }
      #btn-right { grid-column: 3; grid-row: 2; }
      .dpad {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 40, 0.55);
        color: #fff;
        font-size: 22px;
        touch-action: none;             /* stop the browser scrolling/zooming */
        -webkit-user-select: none;
        user-select: none;
      }
      .dpad:active { background: rgba(70, 120, 170, 0.75); }

      #tour-btn {
        margin-top: 22px;
        padding: 12px 28px;
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        background: #2a7d5c;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      #tour-btn:hover { background: #349a71; }

      #tour-skip {
        display: none;                  /* only visible while the tour runs */
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 15;
        padding: 10px 18px;
        font-size: 14px;
        color: #fff;
        background: rgba(20, 30, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        cursor: pointer;
      }

      #info-panel {
        display: none;                 /* hidden until something is clicked */
        position: fixed;               /* floats over the 3D canvas */
        top: 20px;
        right: 20px;
        width: 300px;
        padding: 16px 20px;
        background: rgba(20, 30, 40, 0.88);
        color: #fff;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-family: system-ui, sans-serif;
        z-index: 10;                   /* draw on top of the canvas */
      }
      #info-panel h2  { margin: 0 0 8px; font-size: 20px; }
      #info-panel p   { margin: 0; font-size: 14px; line-height: 1.5; }
      #info-close {
        position: absolute;
        top: 8px; right: 10px;
        background: none; border: none;
        color: #fff; font-size: 16px; cursor: pointer;
      }
    </style>
  </body>
</html>
