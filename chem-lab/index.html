<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load non-blocking (media swap): first paint uses system-ui,
         then the brand fonts swap in once ready (display=swap in the URL). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
    <title>Chemistry Lab</title>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-live="polite">
      <div id="loading-card">
        <svg id="loading-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <g id="flask-group">
            <rect x="18" y="8" width="12" height="4" rx="2" fill="#0a63ad"/>
            <rect x="20" y="10" width="8" height="10" fill="#054b89"/>
            <path d="M20 20 L15 36 a9 9 0 0 0 18 0 L28 20 Z" fill="#054b89"/>
            <!-- the reaction liquid: fills the bulb as loading progresses (CSS var
                 --liquid driven from loader.js), sloshes + rises bubbles -->
            <g id="flask-liquid-wrap">
              <ellipse id="flask-liquid" cx="24" cy="37" rx="8.2" ry="5.6" fill="#4da3ff"/>
              <circle class="flask-bubble" cx="21.6" cy="36"  r="1.1" fill="#eaf4ff"/>
              <circle class="flask-bubble" cx="26.2" cy="37.6" r="0.9" fill="#eaf4ff"/>
              <circle class="flask-bubble" cx="24.4" cy="34.6" r="0.7" fill="#eaf4ff"/>
            </g>
          </g>
        </svg>
        <h1 id="loading-title">Chemistry Lab</h1>
        <p id="loading-status">Loading&hellip;</p>
        <div id="loading-track"><div id="loading-bar"></div></div>
        <p id="loading-pct">0%</p>
        <button id="loading-reload" hidden>Reload</button>
      </div>
    </div>
    <div id="start-overlay">
      <div id="start-card">
        <h1 id="start-title">Chemistry Lab</h1>
        <p id="overlay-enter">Click anywhere to enter the lab</p>
        <p id="overlay-keys" class="keys"><b>W A S D</b> walk &nbsp;•&nbsp; <b>Mouse</b> look &nbsp;•&nbsp; <b>ESC</b> release cursor &nbsp;•&nbsp; <b>R</b> empty flask</p>
        <div id="overlay-buttons">
          <button id="enter-btn">Enter Lab</button>
          <button id="tour-btn">&#9654; Start Guided Tour</button>
          <button id="reset-flask-btn">&#8635; Reset Flask</button>
          <button id="controls-btn">&#9432; Controls &amp; Safety</button>
        </div>
        <p id="overlay-status"></p>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="action-hint"></div>
    <button id="tour-skip">Skip Tour &#10005;</button>
    <div id="mobile-controls">
      <button id="btn-up" class="dpad">&#9650;</button>
      <button id="btn-left" class="dpad">&#9664;</button>
      <button id="btn-down" class="dpad">&#9660;</button>
      <button id="btn-right" class="dpad">&#9654;</button>
    </div>
    <div id="info-panel">
      <button id="info-close">✕</button>
      <h2 id="info-title"></h2>
      <p id="info-description"></p>
    </div>
    <script type="module" src="/src/main.js"></script>

    <style>
      /* ===== Chem Lab UI · Deep Blue Glass + Sky (brand #054b89) ===== */

      /* --- startup loading screen: static markup, paints before any JS --- */
      #loading-screen {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 40;                   /* top of everything while booting */
        align-items: center;
        justify-content: center;
        background: rgba(2, 9, 20, 0.82);
        font-family: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #loading-card {
        position: relative;
        width: min(420px, calc(100vw - 40px));
        padding: 36px 44px;
        border-radius: 18px;
        text-align: center;
        background: rgba(4, 16, 34, 0.92);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(77, 163, 255, 0.25);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 28px 80px rgba(0, 0, 0, 0.65),
          0 0 60px rgba(77, 163, 255, 0.06);
        color: #eef5fd;
      }
      #loading-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 2px;
        border-radius: 2px;
        background: #4da3ff;
        opacity: 0.85;
      }
      #loading-logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 14px;
        filter: drop-shadow(0 0 16px rgba(77, 163, 255, 0.5));
        transform-origin: 50% 55%;
        animation: flask-bob 3s ease-in-out infinite;
      }
      /* the reaction inside the flask: liquid fills via the --liquid CSS var
         (set from loader.js as the bar advances), sloshes, and bubbles rise. */
      #flask-liquid-wrap {
        transform-origin: 24px 42px;
        transform: scaleY(var(--liquid, 0.4));
        transition: transform 0.4s ease;
      }
      #flask-liquid {
        transform-origin: 24px 38px;
        animation: flask-slosh 2.4s ease-in-out infinite;
      }
      .flask-bubble {
        animation: bubble-rise 2.2s ease-in infinite;
      }
      .flask-bubble:nth-of-type(2) { animation-delay: 0.7s; }
      .flask-bubble:nth-of-type(3) { animation-delay: 1.3s; }
      @keyframes flask-bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-3px); }
      }
      @keyframes flask-slosh {
        0%, 100% { transform: skewX(0); }
        50%      { transform: skewX(-7deg); }
      }
      @keyframes bubble-rise {
        0%   { transform: translateY(0); opacity: 0; }
        20%  { opacity: 0.95; }
        100% { transform: translateY(-9px); opacity: 0; }
      }
      #loading-title {
        margin: 0 0 10px;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #eef5fd;
        animation: title-in 0.6s ease both;
      }
      @keyframes title-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      #loading-status {
        margin: 0 0 16px;
        min-height: 20px;
        font-size: 14px;
        color: #b9cbe2;
      }
      #loading-track {
        height: 6px;
        border-radius: 999px;
        background: rgba(77, 163, 255, 0.14);
        overflow: hidden;
      }
      #loading-bar {
        position: relative;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #4da3ff;
        box-shadow: 0 0 12px rgba(77, 163, 255, 0.6);
        transition: width 0.35s ease;
        overflow: hidden;
      }
      #loading-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: translateX(-100%);
        animation: load-shimmer 1.2s ease infinite;
      }
      @keyframes load-shimmer { to { transform: translateX(100%); } }
      #loading-pct {
        margin: 10px 0 0;
        font-size: 13px;
        color: #8299b2;
        font-variant-numeric: tabular-nums;
      }
      #loading-reload {
        margin-top: 18px;
        padding: 10px 26px;
        border-radius: 10px;
        border: 1px solid rgba(77, 163, 255, 0.35);
        background: #054b89;
        color: #eaf4ff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      #loading-reload:hover { background: #0a63ad; box-shadow: 0 0 18px rgba(77, 163, 255, 0.3); }
      #loading-reload:focus-visible { outline: 2px solid #4da3ff; outline-offset: 2px; }

      /* driven by loader.js: fade-out on done, error card on failure */
      #loading-screen.done { opacity: 0; pointer-events: none; }
      #loading-screen.error #loading-track,
      #loading-screen.error #loading-pct { display: none; }
      #loading-screen.error #loading-status { color: #ff6b7a; }
      @media (prefers-reduced-motion: reduce) {
        #loading-screen, #loading-bar, #flask-liquid-wrap { transition: none; }
        #loading-bar::after, #loading-logo, #flask-liquid, .flask-bubble, #loading-title { animation: none; }
      }

      #start-overlay {
        position: fixed;
        inset: 0;
        display: none;                  /* revealed by loader.done() once the lab is ready */
        align-items: center;
        justify-content: center;
        background: rgba(2, 9, 20, 0.75);
        z-index: 20;
        cursor: pointer;
        font-family: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
        color: #fff;
        text-align: center;
      }
      #start-card {
        position: relative;
        padding: 40px 52px;
        border-radius: 20px;
        background: rgba(4, 16, 34, 0.92);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(77, 163, 255, 0.25);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 28px 80px rgba(0, 0, 0, 0.65),
          0 0 60px rgba(77, 163, 255, 0.06);
      }
      #start-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 2px;
        border-radius: 2px;
        background: #4da3ff;            /* flat brand accent, no gradient */
        opacity: 0.85;
      }
      #start-card h1 {
        margin: 0 0 12px;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 46px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #eef5fd;
        text-shadow: 0 0 30px rgba(77, 163, 255, 0.25);
      }
      #start-card p {
        margin: 4px 0;
        font-size: 16px;
        font-weight: 500;
        color: #b9cbe2;
      }
      #start-card .keys {
        font-size: 14px;
        color: #8299b2;
        margin-top: 18px;
        letter-spacing: 0.3px;
      }
      #start-card .keys b {
        color: #eaf4ff;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(77, 163, 255, 0.10);
        border: 1px solid rgba(77, 163, 255, 0.30);
        font-family: 'Inter', sans-serif;
      }

      #crosshair {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 0 0 2px rgba(77, 163, 255, 0.55),
          0 0 10px rgba(77, 163, 255, 0.7);
        z-index: 15;
        pointer-events: none;
      }
      #action-hint {
        display: none;
        position: fixed;
        top: 56%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 10px;
        background: rgba(4, 16, 34, 0.88);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(77, 163, 255, 0.35);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        color: #eaf4ff;
        font-family: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.3px;
        z-index: 15;
        pointer-events: none;
      }

      #mobile-controls {
        display: none;
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 15;
        grid-template-columns: repeat(3, 64px);
        grid-template-rows: repeat(2, 64px);
        gap: 8px;
      }
      #btn-up    { grid-column: 2; grid-row: 1; }
      #btn-left  { grid-column: 1; grid-row: 2; }
      #btn-down  { grid-column: 2; grid-row: 2; }
      #btn-right { grid-column: 3; grid-row: 2; }
      .dpad {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        border: 1px solid rgba(77, 163, 255, 0.35);
        background: rgba(4, 16, 34, 0.88);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        color: #eaf4ff;
        font-size: 22px;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .dpad:active {
        background: #054b89;            /* flat brand fill */
        color: #eaf4ff;
      }

      #overlay-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 26px;
      }
      #overlay-buttons button {
        padding: 13px 32px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease,
          border-color 0.18s ease, filter 0.18s ease;
      }
      #overlay-buttons button:hover { transform: translateY(-2px); }
      #overlay-buttons button:active { transform: translateY(1px); }
      #overlay-buttons button:focus-visible {
        outline: 2px solid #4da3ff;
        outline-offset: 3px;
      }
      #enter-btn {
        background: #054b89;            /* flat brand fill, no gradient */
        color: #eaf4ff;
        border: 1px solid rgba(77, 163, 255, 0.35);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      #enter-btn:hover {
        background: #0a63ad;
        color: #f4fffb;
        box-shadow: 0 0 24px rgba(77, 163, 255, 0.30), 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #enter-btn:active { background: #043a68; }
      #tour-btn {
        background: transparent;
        color: #eaf4ff;
        border: 1px solid rgba(77, 163, 255, 0.35);
      }
      #tour-btn:hover {
        background: rgba(77, 163, 255, 0.14);
        color: #ffffff;
        border-color: rgba(77, 163, 255, 0.65);
      }
      #reset-flask-btn {
        background: rgba(255, 107, 122, 0.10);
        color: #ffd7dc;
        border: 1px solid rgba(255, 107, 122, 0.45);
      }
      #reset-flask-btn:hover {
        background: rgba(255, 107, 122, 0.28);
        color: #ffffff;
        border-color: rgba(255, 107, 122, 0.85);
      }
      #controls-btn {
        background: transparent;
        color: #eaf4ff;
        border: 1px solid rgba(77, 163, 255, 0.35);
      }
      #controls-btn:hover {
        background: rgba(77, 163, 255, 0.14);
        color: #ffffff;
        border-color: rgba(77, 163, 255, 0.65);
      }
      #overlay-status {
        margin: 16px 0 0;
        min-height: 20px;
        font-size: 14px;
        color: #4da3ff;
      }

      #tour-skip {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 15;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        color: #eaf4ff;
        background: rgba(4, 16, 34, 0.88);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(77, 163, 255, 0.35);
        border-radius: 10px;
        cursor: pointer;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #tour-skip:hover { border-color: rgba(77, 163, 255, 0.7); background: rgba(77, 163, 255, 0.10); }

      #info-panel {
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        width: 320px;
        padding: 20px 24px;
        background: rgba(4, 16, 34, 0.90);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        color: #eef5fd;
        border-radius: 14px;
        border: 1px solid rgba(77, 163, 255, 0.25);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.6),
          0 0 50px rgba(77, 163, 255, 0.05);
        font-family: 'Inter', system-ui, -apple-system, Roboto, sans-serif;
        z-index: 10;
      }
      #info-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 16px;
        right: 16px;
        height: 2px;
        border-radius: 2px;
        background: #4da3ff;            /* flat brand accent */
        opacity: 0.75;
      }
      #info-panel h2 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 600;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        color: #eef5fd;
        padding-right: 22px;
      }
      #info-panel p {
        margin: 0;
        font-size: 14px;
        line-height: 1.65;
        color: #b9cbe2;
      }
      #info-close {
        position: absolute;
        top: 12px;
        right: 14px;
        background: none;
        border: none;
        color: #8299b2;
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        line-height: 1;
      }
      #info-close:hover { color: #ffffff; background: rgba(255, 255, 255, 0.08); }
    </style>
  </body>
</html>
