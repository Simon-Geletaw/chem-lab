<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chem-lab</title>
  </head>
  <body>
    <div id="start-overlay">
      <div id="start-card">
        <h1 id="start-title">Chemistry Lab</h1>
        <p id="overlay-enter">Click anywhere to enter</p>
        <p id="overlay-keys" class="keys"><b>W A S D</b> walk &nbsp;•&nbsp; <b>Mouse</b> look &nbsp;•&nbsp; <b>ESC</b> release cursor</p>
        <div id="overlay-buttons">
          <button id="enter-btn">Enter Lab</button>
          <button id="tour-btn">&#9654; Start Guided Tour</button>
          <button id="reset-flask-btn">&#8635; Reset Flask</button>
          <button id="controls-btn">&#9432; Controls &amp; Safety</button>
        </div>
        <p id="overlay-status"></p>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="action-hint"></div>
    <button id="tour-skip">Skip Tour &#10005;</button>
    <div id="mobile-controls">
      <button id="btn-up" class="dpad">&#9650;</button>
      <button id="btn-left" class="dpad">&#9664;</button>
      <button id="btn-down" class="dpad">&#9660;</button>
      <button id="btn-right" class="dpad">&#9654;</button>
    </div>
    <div id="info-panel">
      <button id="info-close">✕</button>
      <h2 id="info-title"></h2>
      <p id="info-description"></p>
    </div>
    <script type="module" src="/src/main.js"></script>

    <style>
      #start-overlay {
        position: fixed;
        inset: 0;                       /* shorthand: top/right/bottom/left = 0 */
        display: flex;                  /* center the card both ways */
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          rgba(10, 18, 26, 0.6),
          rgba(10, 18, 26, 0.15) 45%,
          rgba(10, 18, 26, 0.6)
        );                              /* soft gradient — the lab glows through the middle */
        z-index: 20;                    /* above the canvas AND the info panel */
        cursor: pointer;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        color: #fff;
        text-align: center;
      }
      #start-card {
        padding: 36px 48px;
        border-radius: 16px;
        background: rgba(24, 34, 48, 0.85);
        border: 1px solid rgba(159, 182, 212, 0.35);
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.45);
      }
      #start-card h1 {
        margin: 0 0 10px;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #ffffff;
      }
      #start-card p  {
        margin: 4px 0;
        font-size: 17px;
        font-weight: 500;
        color: #c9d8ea;
      }
      #start-card .keys {
        font-size: 14px;
        color: #9fb6d4;
        margin-top: 16px;
      }
      #start-card .keys b { color: #ffffff; font-weight: 600; }

      #crosshair {
        display: none;                  /* only shown while pointer is locked */
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;          /* center the dot exactly */
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
        z-index: 15;
        pointer-events: none;           /* clicks pass straight through it */

      }
      #action-hint {
        display: none;                  /* hand.js shows it when a key would work */
        position: fixed;
        top: 56%;                       /* just under the crosshair dot */
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 16px;
        border-radius: 8px;
        background: rgba(30, 42, 56, 0.8);
        border: 1px solid rgba(159, 182, 212, 0.3);
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.3px;
        z-index: 15;
        pointer-events: none;           /* never steal clicks (book Phase 2 pitfalls) */
      }

      #mobile-controls {
        display: none;                  /* player.js switches this to 'grid' on touch devices */
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 15;
        /* a 3x2 grid: up sits in the top-middle cell, left/down/right below */
        grid-template-columns: repeat(3, 64px);
        grid-template-rows: repeat(2, 64px);
        gap: 8px;
      }
      #btn-up    { grid-column: 2; grid-row: 1; }
      #btn-left  { grid-column: 1; grid-row: 2; }
      #btn-down  { grid-column: 2; grid-row: 2; }
      #btn-right { grid-column: 3; grid-row: 2; }
      .dpad {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(20, 30, 40, 0.55);
        color: #fff;
        font-size: 22px;
        touch-action: none;             /* stop the browser scrolling/zooming */
        -webkit-user-select: none;
        user-select: none;
      }
      .dpad:active { background: rgba(70, 120, 170, 0.75); }

      #overlay-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
      }
      #overlay-buttons button {
        padding: 12px 30px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
      }
      #overlay-buttons button:focus-visible,
      #overlay-buttons button:active {
        outline: 2px solid #9fc5e8;
        outline-offset: 2px;
      }
      #enter-btn { background: #3f6db3; }
      #enter-btn:hover { background: #4d84c9; }
      #tour-btn { background: #2a7d5c; }
      #tour-btn:hover { background: #349a71; }
      #reset-flask-btn { background: rgba(214, 48, 49, 0.72); }
      #reset-flask-btn:hover { background: #d63031; }
      #controls-btn {
        background: rgba(63, 109, 179, 0.35);
        border: 1px solid rgba(159, 182, 212, 0.5);
      }
      #controls-btn:hover { background: rgba(63, 109, 179, 0.55); }
      #overlay-status {
        margin: 16px 0 0;
        min-height: 20px;
        font-size: 14px;
        color: #9fb6d4;
      }

      #tour-skip {
        display: none;                  /* only visible while the tour runs */
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 15;
        padding: 10px 18px;
        font-size: 14px;
        color: #fff;
        background: rgba(20, 30, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        cursor: pointer;
      }

      #info-panel {
        display: none;                 /* hidden until something is clicked */
        position: fixed;               /* floats over the 3D canvas */
        top: 20px;
        right: 20px;
        width: 300px;
        padding: 16px 20px;
        background: rgba(24, 34, 48, 0.85);
        color: #fff;
        border-radius: 12px;
        border: 1px solid rgba(159, 182, 212, 0.35);
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        z-index: 10;                   /* draw on top of the canvas */
      }
      #info-panel h2  { margin: 0 0 8px; font-size: 20px; color: #ffffff; }
      #info-panel p   { margin: 0; font-size: 14px; line-height: 1.55; color: #c9d8ea; }
      #info-close {
        position: absolute;
        top: 8px; right: 10px;
        background: none; border: none;
        color: #fff; font-size: 16px; cursor: pointer;
      }
    </style>
  </body>
</html>
